name: Publish release containers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Docker Hub tag to mirror
        required: true
      publish_latest:
        description: Also update the latest tag
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - trash-sorter-web
          - trash-sorter-agent
          - trash-sorter-models
          - trash-sorter-desktop-exe
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mirror release tag from Docker Hub
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_OWNER: ${{ github.repository_owner }}
        run: >-
          docker buildx imagetools create
          --tag "ghcr.io/${TARGET_OWNER,,}/${IMAGE}:${RELEASE_TAG}"
          "docker.io/nguyenson1710/${IMAGE}:${RELEASE_TAG}"
      - name: Update latest tag
        if: ${{ inputs.publish_latest }}
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_OWNER: ${{ github.repository_owner }}
        run: >-
          docker buildx imagetools create
          --tag "ghcr.io/${TARGET_OWNER,,}/${IMAGE}:latest"
          "docker.io/nguyenson1710/${IMAGE}:${RELEASE_TAG}"
